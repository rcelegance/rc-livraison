<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RC Livraison</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#13294B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--ink:#16203A;--mut:#5B6474;--navy:#13294B;--gold:#B8892B;--goldl:#F6EEDC;--line:#E3E6EC;--card:#fff;--soft:#F5F7FA;
--ok:#1F7A4D;--warn:#B8620E;--bad:#B42318;--okl:#E6F4EC;--warnl:#FCF0E2;--badl:#FDECEA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1626;--ink:#E9ECF2;--mut:#A3ACBD;--navy:#9DB4E0;--gold:#D9AE52;--goldl:#2A2414;--line:#283149;--card:#151E31;--soft:#1A2338;--okl:#12301F;--warnl:#33240F;--badl:#381614}}
:root[data-theme="dark"]{--bg:#0F1626;--ink:#E9ECF2;--mut:#A3ACBD;--navy:#9DB4E0;--gold:#D9AE52;--goldl:#2A2414;--line:#283149;--card:#151E31;--soft:#1A2338;--okl:#12301F;--warnl:#33240F;--badl:#381614}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Sora,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 16px 8px;max-width:720px;margin:auto;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-weight:700;color:var(--navy);font-size:14px}
h1{font-size:20px;margin:0;color:var(--navy)}header small{color:var(--mut);display:block;font-size:12px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav div{max-width:720px;margin:auto;display:flex;overflow-x:auto}
nav button{flex:1;min-width:76px;background:none;border:0;padding:12px 6px;font:600 13px Sora,sans-serif;color:var(--mut);border-bottom:3px solid transparent}
nav button.on{color:var(--navy);border-color:var(--gold)}
main{max-width:720px;margin:auto;padding:14px 16px 60px}
h2{font-size:17px;color:var(--navy);margin:20px 0 8px}h3{font-size:15px;margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:16px Sora,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink)}
textarea{min-height:80px}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:700 16px Sora,sans-serif;margin-top:10px;background:var(--navy);color:#fff}
:root[data-theme="dark"] .btn,.dk .btn{color:#0F1626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0F1626}}
.btn.gold{background:var(--gold);color:#fff}.btn.ghost{background:none;border:1.5px solid var(--navy);color:var(--navy)}
.btn.ok{background:var(--ok);color:#fff}.btn.warn{background:var(--warn);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:13px;margin:6px 6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;font:600 14px Sora,sans-serif;background:var(--card);color:var(--ink)}
.chip.on{border-color:var(--gold);background:var(--goldl);color:var(--navy)}
.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--mut)}
.tag.ok{background:var(--okl);color:var(--ok)}.tag.warn{background:var(--warnl);color:var(--warn)}.tag.bad{background:var(--badl);color:var(--bad)}
.note{border-left:4px solid var(--gold);background:var(--goldl);padding:10px 12px;border-radius:8px;font-size:14px;margin:10px 0}
.note.bad{border-color:var(--bad);background:var(--badl)}.note.ok{border-color:var(--ok);background:var(--okl)}.note.warn{border-color:var(--warn);background:var(--warnl)}
.liv{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.liv b{display:block}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:12px}
td.n,th.n{text-align:right}
/* batterie : élément phare */
.bat{display:flex;gap:16px;align-items:center}
.cell{width:64px;height:120px;border:3px solid var(--navy);border-radius:10px;position:relative;flex:none;overflow:hidden;background:var(--soft)}
.cell:before{content:"";position:absolute;top:-3px;left:20px;width:18px;height:6px;background:var(--navy);border-radius:0 0 3px 3px}
.fill{position:absolute;left:0;right:0;bottom:0;transition:height .6s}
.cell i{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink);opacity:.45}
.pct{font-size:34px;font-weight:700;line-height:1}
.big{font-size:22px;font-weight:700;color:var(--navy)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:8px}
.kpi div{background:var(--soft);border-radius:10px;padding:10px}.kpi b{display:block;font-size:18px;color:var(--navy)}.kpi span{font-size:12px;color:var(--mut)}
.hide{display:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header><div class="logo">RC</div><div><h1>RC Livraison</h1><small id="who">Royaum' des Chaussures</small></div><button class="btn sm ghost" id="lock" style="margin-left:auto"></button></header>
<nav><div id="tabs"></div></nav>
<main id="app"></main>

<script>
/* ===================== Données ===================== */
const KEY='rcliv_v1';
const DEF={
 settings:{

  shop:[12.37429,-1.47157], shopOk:false, waBoutique:'22670801730', waDir:'22672052470', baseUrl:'',
  quota:6, prime:300, coutKm:20, cyrRef:2.5, prixL:850, pleinF:3000, kwhF:120, tarif:{base:1000,seuil:10,tol:11,pas:5,plus:500}, motoPrix:850000, motoMois:12, vidF:3500, pin:'', codeClient:false, ctrl:5, gare:{client:1500,ticket:1000,societe:1000}, mesure:true, coutLivreurs:245000,
  batteries:[
   {id:'e30',nom:'Moto électrique 30 Ah',ah:30,volt:76.8,km42:80,chargeA:8},
   {id:'e50',nom:'Moto électrique 50 Ah',ah:50,volt:76.8,km42:133,chargeA:8}
  ]
 },
 bat:{e30:{pct:100,km:0,odoRef:null,at:null},e50:{pct:100,km:0,odoRef:null,at:null}},
 cyrus:{km:0,pleins:[],users:[],vid:null}, repa:[], epargne:[],
 livs:[]
};
const CAT0=[{"n": "Adidas", "pa": null, "pv": null}, {"n": "Ana Galia", "pa": 10000, "pv": null}, {"n": "Babauche", "pa": 8500, "pv": 14000}, {"n": "Basket enfant", "pa": 2500, "pv": null}, {"n": "Basket Prama", "pa": 3250, "pv": 6000}, {"n": "Basket Promo", "pa": 3250, "pv": 5000}, {"n": "Berlutie de Paris", "pa": 13000, "pv": 15000}, {"n": "Bouk Shoes", "pa": 12500, "pv": 18000}, {"n": "Bromey", "pa": 12000, "pv": null}, {"n": "Ceinture cuir", "pa": 6500, "pv": 10000}, {"n": "Ceinture simple", "pa": 3000, "pv": 6000}, {"n": "Celio", "pa": 13000, "pv": null}, {"n": "Celio montante", "pa": 12000, "pv": null}, {"n": "Chamo", "pa": 8500, "pv": 15000}, {"n": "Chausse-pied", "pa": 750, "pv": null}, {"n": "Chaussette", "pa": 300, "pv": null}, {"n": "Cirage", "pa": 400, "pv": 750}, {"n": "Gellegien", "pa": 10000, "pv": 15000}, {"n": "Gemine Quality", "pa": null, "pv": null}, {"n": "Grosse Mocassin", "pa": 14000, "pv": 20000}, {"n": "Grosse Pointure", "pa": 6000, "pv": 12000}, {"n": "H Remaw", "pa": 12500, "pv": 20000}, {"n": "IM Shoes montante", "pa": 13000, "pv": null}, {"n": "IM Shoes soulier", "pa": 13000, "pv": null}, {"n": "Jaguar", "pa": 9000, "pv": null}, {"n": "JMS", "pa": 7500, "pv": 15000}, {"n": "John Foster", "pa": 13000, "pv": 20000}, {"n": "John Foster montant", "pa": 13000, "pv": null}, {"n": "Kosta", "pa": 10000, "pv": null}, {"n": "Lacoste", "pa": 6000, "pv": null}, {"n": "Liba Fashion", "pa": 6000, "pv": null}, {"n": "Mocassin Sulti", "pa": 11000, "pv": null}, {"n": "Mocassin Turquie", "pa": 15000, "pv": 20000}, {"n": "New Fashion", "pa": null, "pv": null}, {"n": "Nike", "pa": 11000, "pv": 17500}, {"n": "Novalion", "pa": 12000, "pv": 18000}, {"n": "Nu pied cuir", "pa": 13000, "pv": 17500}, {"n": "Nu pied Hazana", "pa": 7000, "pv": 12000}, {"n": "Nu pied lion", "pa": 8500, "pv": 15000}, {"n": "Nu pied Timberland", "pa": null, "pv": null}, {"n": "Nu pied Zaza", "pa": 3500, "pv": 5000}, {"n": "Nulimsen", "pa": 12000, "pv": 17500}, {"n": "OGGI", "pa": 8000, "pv": null}, {"n": "Original", "pa": 6000, "pv": 10000}, {"n": "Pierre Cardin", "pa": 10000, "pv": 15000}, {"n": "Présidentielle bout pointu", "pa": 11500, "pv": null}, {"n": "Présidentielle bout rond", "pa": 11500, "pv": null}, {"n": "RC Elegance", "pa": 11500, "pv": null}, {"n": "RC Moccasin", "pa": 11500, "pv": null}, {"n": "RC Soulier boucle", "pa": 12000, "pv": null}, {"n": "RC Soulier jolie gomme", "pa": 13000, "pv": 17500}, {"n": "Retos", "pa": 11000, "pv": 18000}, {"n": "Ripano", "pa": 11500, "pv": 15000}, {"n": "Sebago", "pa": 5750, "pv": null}, {"n": "SLmu+3", "pa": 10000, "pv": null}, {"n": "Timberland soulier", "pa": null, "pv": null}, {"n": "TOD", "pa": 9000, "pv": null}, {"n": "Vrai cuir", "pa": 7000, "pv": null}, {"n": "Weston", "pa": 12000, "pv": null}, {"n": "Louis Vuitton", "pa": 12000, "pv": 20000}, {"n": "Oristano vrai cuir", "pa": 9500, "pv": 13000}];
let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
 if(!S||!S.settings){S=JSON.parse(JSON.stringify(DEF))}
 for(const b of S.settings.batteries){if(!S.bat[b.id])S.bat[b.id]={pct:100,km:0,at:null}}
 for(const k in S.bat){const x=S.bat[k];x.sessions=x.sessions||[];x.users=x.users||[];if(x.plug===undefined)x.plug=null}
 if(!S.cyrus)S.cyrus={km:0,pleins:[],users:[],vid:null};
 if(S.settings.cyrRef==null)S.settings.cyrRef=2.5;
 if(!S.settings.prixL){S.settings.prixL=850;S.settings.pleinF=3000}
 const st0=S.settings;if(!st0.tarif)st0.tarif={base:1000,seuil:10,tol:11,pas:5,plus:500};if(!st0.kwhF)st0.kwhF=120;if(!st0.motoPrix){st0.motoPrix=850000;st0.motoMois=12}if(!st0.vidF)st0.vidF=3500;if(st0.codeClient==null)st0.codeClient=false;if(!st0.ctrl)st0.ctrl=5;if(!st0.gare)st0.gare={client:1500,ticket:1000,societe:1000};if(st0.pin==null)st0.pin='';if(!st0.shop){st0.shop=[12.37429,-1.47157];st0.shopOk=false}if(st0.shopOk==null)st0.shopOk=true;if(!st0.waDir)st0.waDir='22672052470';
 S.repa=S.repa||[];S.epargne=S.epargne||[];if(!S.cat||S.catV!==2){S.cat=CAT0.map((c,i)=>({id:'c'+i,...c}));S.catV=2}
 for(const c0 of CAT0){const c=S.cat.find(x=>x.n===c0.n);if(c){if(!c.pv&&c0.pv)c.pv=c0.pv}else S.cat.push({id:uid(),...c0})}S.catLog=S.catLog||[];
 if(!S.elec){S.elec={bat:'e30',km:0,at:null,users:[],etat:{}}}
 for(const b of S.settings.batteries)if(!S.elec.etat[b.id])S.elec.etat[b.id]=b.id===S.elec.bat?'montee':'pleine';
 for(const l of S.livs)if(l.veh==='e30'||l.veh==='e50')l.veh='elec';}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();

/* ===================== Outils ===================== */
const $=s=>document.querySelector(s);
const F=n=>Math.round(n||0).toLocaleString('fr-FR').replace(/\u202f|\u00a0/g,' ')+' F';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const dec=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))};
function hav(a,b){const R=6371,r=x=>x*Math.PI/180;const dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);
 const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const route=(a,b)=>hav(a,b)*1.35; // estimation par la route : ligne droite + 35 %
function frais(k,t=S.settings.tarif){if(k<=t.tol)return t.base;return t.base+t.plus*Math.ceil((k-t.seuil)/t.pas)}
function grille(){const t=S.settings.tarif,out=[[`0 à ${t.tol} km`,t.base]];for(let a=t.seuil,i=1;i<=5;i++,a+=t.pas){out.push([`${i===1?t.tol:a} à ${a+t.pas} km`,t.base+t.plus*i])}return out}
function coutKmVeh(v){const st=S.settings;if(v==='cyrus')return st.prixL*st.cyrRef/100;if(v==='elec')return whKm(batMontee(),45)/1000*st.kwhF;if(v==='perso')return st.coutKm;return 0}
const coutCourse=l=>l.cout!=null?l.cout:Math.round((l.kmAR||0)*coutKmVeh(l.veh));
function parsePos(t){if(!t)return null;const m=String(t).match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);return m?[+m[1],+m[2]]:null}
function gps(){return new Promise((ok,ko)=>{if(!navigator.geolocation)return ko(new Error('GPS indisponible sur ce téléphone'));
 navigator.geolocation.getCurrentPosition(p=>ok([p.coords.latitude,p.coords.longitude,p.coords.accuracy]),e=>ko(e),{enableHighAccuracy:true,timeout:20000,maximumAge:0})})}
const sms=(num,txt)=>'sms:'+(num?'+'+String(num).replace(/\D/g,''):'')+'?body='+encodeURIComponent(txt);
const btnSms=(num,txt,lib='Envoyer par SMS (sans Internet)')=>`<a class="btn sm ghost" style="display:block;text-align:center" href="${sms(num,txt)}">${lib}</a>`;
const wa=(num,txt)=>'https://wa.me/'+(num||'').replace(/\D/g,'')+'?text='+encodeURIComponent(txt);
const fmtD=t=>t?new Date(t).toLocaleString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const liv=id=>S.settings.livreurs.find(l=>l.id===id)||{nom:'?',tel:''};
function vehs(){return [{id:'cyrus',nom:'Moto Cyrus'},{id:'elec',nom:'Moto électrique ('+batMontee().ah+' Ah)'},{id:'perso',nom:'Moto perso'}]}
const vehNom=id=>(vehs().find(v=>v.id===id)||{nom:id}).nom;
function telNorm(t){t=(t||'').replace(/\D/g,'');if(t.length===8)t='226'+t;return t}

/* ===================== Photos des reçus (archive dans le téléphone) ===================== */
function idb(){return new Promise((ok,ko)=>{if(!window.indexedDB)return ko(new Error('no idb'));const r=indexedDB.open('rcliv_photos',1);
 r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)})}
async function photoPut(k,blob){const d=await idb();return new Promise((ok,ko)=>{const t=d.transaction('p','readwrite');t.objectStore('p').put(blob,k);t.oncomplete=ok;t.onerror=()=>ko(t.error)})}
async function photoGet(k){const d=await idb();return new Promise(ok=>{const q=d.transaction('p').objectStore('p').get(k);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null)})}
function compresser(file,max=1000){return new Promise((ok,ko)=>{const img=new Image(),u=URL.createObjectURL(file);
 img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):ko(new Error('photo')),'image/jpeg',0.65)};
 img.onerror=()=>ko(new Error('photo illisible'));img.src=u})}
async function archiver(file,info){const b=await compresser(file);const k='r'+uid();await photoPut(k,b);
 S.recus=S.recus||[];S.recus.unshift({k,at:Date.now(),...info});save();return k}
const champPhoto=(id,lib='📷 Photo du reçu')=>`<label class="btn ghost" style="text-align:center;cursor:pointer">${lib}<input type="file" accept="image/*" capture="environment" id="${id}" style="display:none"></label><div class="mut" id="${id}_ok"></div>`;
function suivrePhoto(id){const i=$('#'+id);if(i)i.onchange=()=>{const z=$('#'+id+'_ok');if(z)z.textContent=i.files[0]?'✓ Photo prise':''}}

/* ===================== Batteries ===================== */
// Consommation Wh/km selon la vitesse, terrain plat : calée sur 80 km à 42 km/h pour la 30 Ah
function whKm(b,v){const c42=b.ah*b.volt/b.km42;return c42*(0.6+0.4*(v/42)**2)}
const wh=b=>b.ah*b.volt;
const rangeAt=(b,v)=>wh(b)/whKm(b,v);
const VREF=45; // vitesse de calcul : 45 km/h (maximum 50)
function batMontee(){return S.settings.batteries.find(b=>b.id===S.elec.bat)||S.settings.batteries[0]}
function kmRest(v=VREF){const b=batMontee();return Math.max(0,(wh(b)-S.elec.km*whKm(b,VREF))/whKm(b,v))}
function batPct(){const b=batMontee();return Math.max(0,100-S.elec.km*whKm(b,VREF)/wh(b)*100)}
function conseil(){const r=Math.floor(kmRest());
 if(r<=10)return{c:'bad',t:'Changer de batterie',d:`Il reste environ ${r} km à 45 km/h. La moto ne sort plus : mettre la batterie pleine (ou prendre la Cyrus) et brancher celle-ci.`};
 if(r<=20)return{c:'warn',t:'Batterie faible',d:`Il reste environ ${r} km à 45 km/h. Seulement une course proche (moins de ${Math.max(0,Math.floor((r-10)/1.15))} km aller-retour), puis changer la batterie au retour.`};
 return{c:'ok',t:'Prête',d:`Il reste environ ${r} km à 45 km/h.`}}
function couleur(r){return r<=10?'var(--bad)':r<=20?'var(--warn)':'var(--ok)'}
function checkCourse(veh,kmAR){if(veh!=='elec'||!kmAR)return null;const r=kmRest(),reste=r-kmAR*1.15;
 if(reste<10)return{c:'bad',t:`Batterie insuffisante : course ≈ ${kmAR.toFixed(1)} km aller-retour, il reste ${Math.floor(r)} km. Changer la batterie ou prendre la Cyrus.`};
 if(reste<=20)return{c:'warn',t:`Course possible. Au retour il restera environ ${Math.floor(reste)} km : changer la batterie.`};
 return{c:'ok',t:`Batterie OK : il restera environ ${Math.floor(reste)} km après cette course.`}}

/* ===================== Période 15 → 14 ===================== */
function periode(ref){const d=ref?new Date(ref):new Date();let y=d.getFullYear(),m=d.getMonth();if(d.getDate()<15)m--;
 const deb=new Date(y,m,15),fin=new Date(y,m+1,15);return{deb:+deb,fin:+fin,lib:`15/${String(deb.getMonth()+1).padStart(2,'0')} au 14/${String(fin.getMonth()+1).padStart(2,'0')}/${fin.getFullYear()}`}}

/* ===================== Navigation ===================== */
const TABS=[['bon','Nouveau bon'],['cours','En cours'],['art','Articles'],['livreuse','Livreuse'],['bat','Véhicules'],['caisse','Caisse moto'],['recu','Recevoir'],['bilan','Bilan'],['reg','Réglages']];
let tab='bon',bonRecu=null,pasteMsg='',dir=false;
let role=(()=>{try{return localStorage.getItem('rcliv_role')}catch(e){return null}})();
const ACCES={livreuse:['livreuse'],boutique:['bon','cours','art','bat','caisse'],directeur:[]};
const permis=()=>dir?TABS.map(t=>t[0]):(ACCES[role]||[]);
function nav(){ $('#tabs').innerHTML=TABS.filter(([k])=>permis().includes(k)).map(([k,l])=>`<button class="${k===tab?'on':''}" data-t="${k}">${l}</button>`).join('');
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)})}
function render(){
 $('#lock').textContent=dir?'Verrouiller':'Directeur';

function ouvrirDir(){const st=S.settings;
 $('#tabs').innerHTML='';

 if($('#batchk'))$('#batchk').innerHTML=chk?`<div class="note ${chk.c}">${chk.t}</div>`:'';}
function creerBon(){const st=S.settings;
 const items=draft.items.filter(i=>i.a.trim()||+i.x).map(i=>({a:i.a.trim()||'Modèle',p:i.p,x:+i.x||0}));

 const L={id:uid(),type:draft.type,at:Date.now(),cl:draft.cl,tel:draft.tel,items,art:items.map(i=>i.a+(i.p?' ('+i.p+')':'')).join(', '),m:totalItems(items),fm,
  livreur:draft.livreur,veh:draft.veh,raison:draft.raison,code:String(Math.floor(1000+Math.random()*9000)),
  cpos:parsePos(draft.pos),statut:'en_cours',alertes:[],remis:false,retour:false,controle:Math.random()<1/(st.ctrl||5),cc:!!st.codeClient};
 for(const it of items){const c=S.cat.find(x=>x.n.toLowerCase()===it.a.toLowerCase());
  if(c&&!c.pv&&it.x){c.pv=it.x;S.catLog.unshift({at:Date.now(),n:c.n,av:null,ap:it.x,par:'appris sur un bon'})}
  else if(!c&&it.x&&it.a!=='Modèle'){S.cat.push({id:uid(),n:it.a,pv:it.x,pa:null});S.catLog.unshift({at:Date.now(),n:it.a+' (nouveau)',av:null,ap:it.x,par:'appris sur un bon'})}}
 S.livs.unshift(L);save();
 const payload={cc:L.cc?1:0,i:L.id,y:L.type,c:L.cl,t:L.tel,it:items.map(i=>[i.a,i.p,i.x]),fm,tf:st.tarif,g:st.gare,l:liv(L.livreur).nom,v:vehNom(L.veh),s:st.shop,d:L.at,cp:L.cpos,w:st.waBoutique};
 const code='RCB:'+enc(payload);
 const lien=st.baseUrl?st.baseUrl.replace(/#.*$/,'')+'#'+code:'';
 const fr=gare?'Envoi déjà payé':fm==='auto'?'Livraison : selon la distance (l\'appli calcule)':+fm===0?'Livraison OFFERTE':'Livraison : '+F(+fm);
 const txt=`🛵 BON RC Elegance\n${gare?'Envoi province : ':'Client : '}${L.cl}${L.tel?' ('+L.tel+')':''}\n${items.map(i=>`• ${i.a}${i.p?' pt '+i.p:''} : ${F(i.x)}`).join('\n')}\n${fr}\nVéhicule : ${vehNom(L.veh)}\n\n${lien?'Ouvrir le bon : '+lien+'\n\n':''}Code du bon (à coller dans RC Livraison) :\n${code}`;
 draft={type:'client',livreur:draft.livreur,veh:draft.veh,raison:'',items:[{a:'',p:'',x:''}],fm:'auto'};
 $('#app').innerHTML=`<div class="note ok">Bon créé pour <b>${esc(L.cl)}</b> : ${items.length} modèle(s), ${F(L.m)}. Envoyez dans l'ordre :</div>
 <a class="btn" href="${wa(liv(L.livreur).tel,txt)}" target="_blank" rel="noopener">1. Envoyer le bon à ${esc(liv(L.livreur).nom)}</a>${btnSms(liv(L.livreur).tel,txt)}
 ${!gare&&L.cc&&L.tel?`<a class="btn gold" href="${wa(telNorm(L.tel),`Bonjour, votre commande RC Elegance est en route 🛵\nVotre code de livraison : ${L.code}\nDonnez ce code au livreur seulement quand vous avez vos chaussures en main. Merci !`)}" target="_blank" rel="noopener">2. Envoyer le code ${L.code} au client</a>${btnSms(telNorm(L.tel),'RC Elegance : votre code de livraison est '+L.code+'. Donnez-le au livreur seulement quand vous avez vos chaussures en main.')}`:(gare||!L.cc)?'':`<div class="note">Code client : <b>${L.code}</b> (à donner au client par téléphone).</div>`}
 ${rappelVeh(L.veh,true)}<button class="btn ghost" id="nv">Nouveau bon</button>`;
 $('#nv').onclick=vBon;}
function rappelVeh(v,shop){
 if(v==='cyrus'){const r=cyrLitres();return `<div class="note ${r<1?'bad':''}"><b>Cyrus :</b> essence estimée ${r.toFixed(1)} L. ${shop?'Aucun argent d\'essence ne sort de la caisse : le plein se fait seulement à la station, avec reçu, et se note dans Véhicules.':'Panne d\'essence : appeler la boutique, ne pas acheter au bord de la route.'}</div>`}
 if(v==='elec'){const c=conseil();return `<div class="note ${c.c}"><b>Moto électrique (${batMontee().ah} Ah) :</b> ${c.d} L'écran de la moto ne marche pas : c'est l'application qui fait la jauge. 50 km/h maximum.</div>`}
 return ''}

/* ===================== Vue : en cours / retours (boutique) ===================== */
function vCours(){
 const enc_=S.livs.filter(l=>l.statut==='en_cours');
 const aRegler=S.livs.filter(l=>l.statut!=='en_cours'&&l.statut!=='annule'&&((!l.remis&&l.encaisse>0)||(l.statut==='pas_achete'||l.statut==='partiel')&&!l.retour||(l.type==='gare'&&!l.photo)));
 $('#app').innerHTML=`<h2>Recevoir le retour d'une livreuse</h2>
 <div class="card"><label>Coller ici le message reçu sur WhatsApp</label><textarea id="rr" placeholder="RCR:...">${esc(pasteMsg)}</textarea>
 <button class="btn" id="valR">Valider la livraison</button><div id="rmsg"></div></div>
 <button class="btn gold" id="rapDir">Envoyer le point du jour au Directeur</button>
 <div id="rapZone"></div><p class="mut">À faire chaque soir à la fermeture, et tout de suite en cas d'alerte.</p>
 <h2>En route (${enc_.length})</h2>${enc_.length?enc_.map(cardLiv).join(''):'<p class="mut">Aucune course en route.</p>'}
 <h2>À régler (${aRegler.length})</h2>${aRegler.length?aRegler.map(cardRegler).join(''):'<p class="mut">Argent et chaussures : tout est rentré.</p>'}`;
 $('#rapDir').onclick=envoyerPoint;
 $('#valR').onclick=()=>{const t=$('#rr').value;if(/RCP:/.test(t)){$('#rmsg').innerHTML=lireReglages(t);return}const r=lireRetour(t);$('#rmsg').innerHTML=r;if(r.includes('ok')&&!r.includes('data-alr'))setTimeout(()=>{pasteMsg='';vCours()},1600);if($('[data-alr]'))$('[data-alr]').onclick=envoyerPoint};
 document.querySelectorAll('[data-an]').forEach(b=>b.onclick=()=>{const L=S.livs.find(x=>x.id===b.dataset.an);if(confirm('Annuler ce bon ?')){L.statut='annule';save();vCours()}});
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{S.livs.find(x=>x.id===b.dataset.rm).remis=true;save();vCours()});
 document.querySelectorAll('[data-np]').forEach(b=>b.onclick=()=>{const l=S.livs.find(x=>x.id===b.dataset.np);l.photo=true;S.recus=S.recus||[];S.recus.unshift({k:null,at:Date.now(),type:'Gare',label:(l.cl||'')+' · reçu '+(l.recu||'?')+' (sans photo)',montant:l.ticket});save();vCours()});
 aRegler.filter(l=>l.type==='gare'&&!l.photo).forEach(l=>{const i=$('#pg_'+l.id);if(i)i.onchange=async()=>{if(!i.files[0])return;
  try{await archiver(i.files[0],{type:'Gare',label:l.cl+(l.recu?' · reçu '+l.recu:''),montant:l.ticket});l.photo=true;save();vCours()}catch(e){alert('Photo non enregistrée : '+e.message)}}});
 document.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{S.livs.find(x=>x.id===b.dataset.rt).retour=true;save();vCours()});
}
function cardLiv(l){return `<div class="card liv"><div><b>${esc(l.cl)}</b><span class="mut">${esc(liv(l.livreur).nom)} · ${esc(vehNom(l.veh))} · ${fmtD(l.at)}</span><br><span class="mut">${esc(l.art)} · ${F(l.m)} · code ${l.code}</span></div><button class="btn sm ghost" data-an="${l.id}">Annuler</button></div>`}
function cardRegler(l){const st={achete:'Tout acheté',partiel:'En partie',pas_achete:'Pas acheté',depose:'Déposé gare'}[l.statut]||l.statut;
 return `<div class="card"><div class="liv"><div><b>${esc(l.cl)}</b><span class="mut">${esc(liv(l.livreur).nom)} · ${st} · ${fmtD(l.arr)}</span></div><span class="tag ${l.alertes.length?'bad':'ok'}">${l.alertes.length?l.alertes.length+' alerte(s)':'OK'}</span></div>
 ${l.alertes.map(a=>`<div class="note bad">${esc(a)}</div>`).join('')}
 ${!l.remis&&l.encaisse>0?`<button class="btn sm" data-rm="${l.id}">Argent remis : ${F(l.encaisse)}</button>`:''}
 ${l.type==='gare'&&!l.photo?`<div class="note warn">${l.sansPhoto?'Envoyé sans photo (urgence), reçu n° '+esc(l.recu||'?')+'. Archivez la photo quand le livreur la donne :':'Archivez la photo du reçu reçue sur WhatsApp :'}</div><button class="btn sm ghost" data-np="${l.id}">Pas de photo : garder seulement le numéro</button>${champPhoto('pg_'+l.id,'📷 Archiver la photo du reçu')}`:''}
 ${(l.statut==='pas_achete'||l.statut==='partiel')&&!l.retour?`<button class="btn sm ghost" data-rt="${l.id}">Revenu en boutique : ${esc((l.rendre||[l.art]).join(', '))}</button>`:''}</div>`}
function lireRetour(txt){const m=(txt||'').match(/RCR:([A-Za-z0-9_-]+)/);if(!m)return '<div class="note bad">Aucun code RCR trouvé dans ce message.</div>';
 let r;try{r=dec(m[1])}catch(e){return '<div class="note bad">Code abîmé : demandez à la livreuse de renvoyer le message complet.</div>'}
 const L=S.livs.find(x=>x.id===r.i);if(!L)return '<div class="note bad">Ce bon n\'existe pas sur ce téléphone.</div>';
 if(L.statut!=='en_cours')return '<div class="note warn">Ce retour a déjà été enregistré.</div>';
 const sh=S.settings.shop,al=[];let kmA=0;
 if(r.la&&sh){kmA=route(sh,[r.la,r.ln])}
 L.sansPhoto=L.type==='gare'&&!r.ph;L.arr=r.at;L.apos=r.la?[r.la,r.ln]:null;L.precision=r.ac;L.raisonEchec=r.x||'';L.ticket=+r.tk||0;L.recu=r.rc||'';
 L.statut={T:'achete',P:'partiel',N:'pas_achete',G:'depose'}[r.r];
 const its=L.items||[{a:L.art,p:L.pt,x:L.m}];L.kp=r.kp||(r.r==='T'||r.r==='G'?its.map((x,i)=>i):[]);
 L.vendu=L.kp.reduce((a,i)=>a+(its[i]?its[i].x:0),0);
 L.encaisse=L.type==='gare'?0:(r.e!=null?+r.e:L.vendu);
 if(L.cc&&L.type==='client'&&r.r!=='N'&&r.k&&String(r.k)!==L.code)al.push(`Code client faux (saisi : ${r.k}, attendu : ${L.code}).`);
 if(L.cc&&L.type==='client'&&r.r!=='N'&&!r.k)al.push('Sans code client : le client n\'a pas donné son code.');
 if(L.cpos&&L.apos){const d=hav(L.cpos,L.apos)*1000;if(d>300)al.push(`Position douteuse : arrivée à ${Math.round(d)} m de la position envoyée par le client.`);
  kmA=Math.min(kmA,route(sh,L.cpos))||kmA}
 if(!L.apos)al.push('Pas de position GPS à l\'arrivée.');
 const min=(r.at-L.at)/60000;if(kmA&&min>kmA*4+45)al.push(`Course longue : ${Math.round(min)} min pour ${kmA.toFixed(1)} km.`);
 if(L.apos&&r.ac>150)al.push(`GPS imprécis (± ${Math.round(r.ac)} m).`);
 L.kmA=+kmA.toFixed(2);L.kmAR=+(2*kmA).toFixed(2);
 L.frais=L.type==='gare'?S.settings.gare.client:(r.f!=null?+r.f:frais(kmA));L.offert=L.type!=='gare'&&L.fm==='0'&&r.r!=='N';
 if(L.type==='client'&&L.fm==='auto'&&r.f!=null&&kmA&&Math.abs(r.f-frais(kmA))>=500)al.push(`Frais déclarés ${F(r.f)} au lieu de ${F(frais(kmA))} pour ${kmA.toFixed(1)} km.`);
 if(L.veh==='perso')L.indem=Math.round(L.kmAR*S.settings.coutKm);
 L.cout=Math.round(L.kmAR*coutKmVeh(L.veh))+(L.type==='gare'?L.ticket:0);
 if(L.controle)al.push(`Appel de contrôle tiré au sort : appeler ${L.tel||'le client'} pour confirmer.`);

async function packer(o){const json=JSON.stringify(o);
 try{if(window.CompressionStream){const cs=new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());
  let bin='';for(let i=0;i<buf.length;i+=8192)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+8192));
  return '1'+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}}catch(e){}
 return '0'+enc(o)}
async function depacker(t){const k=t[0],d=t.slice(1);if(k==='0')return dec(d);
 let b=d.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
 const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(ds).text())}

 const fr=L.reduce((a,l)=>a+(l.frais||0),0),du=S.livs.filter(l=>!l.remis&&l.encaisse>0).reduce((a,l)=>a+l.encaisse,0);
 const al=L.flatMap(l=>l.alertes.map(a=>'• '+l.cl+' : '+a));
 const px=S.catLog.filter(x=>new Date(x.at).toDateString()===d).map(x=>`• ${x.n} : ${x.av?F(x.av):'—'} → ${F(x.ap)}`);

 return `📊 Point livraisons RC Elegance, ${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
Réussies : ${ok} · Pas achetées : ${ko} · En route : ${route_}

${al.length?'⚠️ Alertes :\n'+al.join('\n'):'Aucune alerte.'}${px.length?'\n💲 Prix modifiés :\n'+px.join('\n'):''}`}

let perRef=null;
function vBilan(){const st=S.settings,P=periode(perRef);
 const L=S.livs.filter(l=>l.at>=P.deb&&l.at<P.fin&&l.statut!=='annule'&&l.statut!=='en_cours');
 const rows=st.livreurs.map(v=>{const m=L.filter(l=>l.livreur===v.id);
  const jours=[...new Set(m.map(l=>new Date(l.at).toDateString()))];
  const ok=m.filter(l=>(l.statut==='achete'||l.statut==='partiel'||l.statut==='depose')&&!l.alertes.some(a=>a.startsWith('Code client faux')));
  let prime=0;if(!st.mesure){for(const j of jours){const n=ok.filter(l=>new Date(l.at).toDateString()===j).length;prime+=Math.max(0,n-st.quota)*st.prime}}
  const indem=m.reduce((s,l)=>s+(l.indem||0),0),km=m.reduce((s,l)=>s+(l.kmAR||0),0),fr=m.reduce((s,l)=>s+(l.frais||0),0);
  const cout=m.reduce((s,l)=>s+coutCourse(l),0),ventes=m.reduce((s,l)=>s+(l.encaisse||0),0);
  const du=m.filter(l=>!l.remis).reduce((s,l)=>s+(l.encaisse||0),0),al=m.reduce((s,l)=>s+l.alertes.length,0);
  return {v,j:jours.length,n:m.length,ok:ok.length,part:m.filter(l=>l.statut==='partiel').length,ko:m.filter(l=>l.statut==='pas_achete').length,km,prime,indem,du,al,fr,cout,ventes,benef:fr-cout-prime}});
 const T=k=>rows.reduce((a,r)=>a+r[k],0);
 const repa=S.repa.filter(r=>r.at>=P.deb&&r.at<P.fin).reduce((a,r)=>a+r.montant,0);
 const epar=S.epargne.filter(e=>e.at>=P.deb&&e.at<P.fin).reduce((a,e)=>a+e.montant,0);
 const vidFaite=S.repa.some(r=>r.motif==='vidange'&&r.at>=P.deb&&r.at<P.fin),vidPrev=vidFaite?0:st.vidF;
 const net=T('benef')-repa-vidPrev-epar-st.coutLivreurs;
 const act=rows.filter(r=>r.n);
 const best=(k,f=x=>x[k])=>act.length?act.slice().sort((a,b)=>f(b)-f(a))[0]:null;
 const bL=best('ok'),bT=best('t',r=>r.n>=3?r.ok/r.n:-1),bB=best('benef'),bK=best('km');
 const raisons={};L.filter(l=>l.statut==='pas_achete').forEach(l=>raisons[l.raisonEchec||'?']=(raisons[l.raisonEchec||'?']||0)+1);
 const gare=L.filter(l=>l.type==='gare');
 const pl=S.cyrus.pleins.filter(p=>p.at>=P.deb&&p.at<P.fin),essence=pl.reduce((a,p)=>a+p.montant,0);
 $('#app').innerHTML=`<div class="liv" style="align-items:center"><button class="btn sm ghost" id="pv">‹ Mois préc.</button><b>${P.lib}</b><button class="btn sm ghost" id="nx">Mois suiv. ›</button></div>
 ${st.mesure?'<div class="note">Mois de mesure : les primes ne sont pas versées. Les chiffres servent à fixer le quota et la prime.</div>':''}
 <h2>Classement du mois</h2>
 ${act.length?`<div class="card">
  ${bL?`<div class="liv"><span>Plus de livraisons réussies</span><b>${esc(bL.v.nom)} · ${bL.ok}</b></div>`:''}
  ${bT&&bT.n>=3?`<div class="liv"><span>Meilleur taux de réussite</span><b>${esc(bT.v.nom)} · ${Math.round(bT.ok/bT.n*100)} %</b></div>`:''}
  ${bK?`<div class="liv"><span>Plus de kilomètres</span><b>${esc(bK.v.nom)} · ${bK.km.toFixed(0)} km</b></div>`:''}
  ${bB?`<div class="liv"><span>Plus gros bénéfice apporté</span><b>${esc(bB.v.nom)} · ${F(bB.benef)}</b></div>`:''}
  <div class="tbl" style="margin-top:10px"><table><tr><th>Livreur</th><th class="n">Réussies</th><th class="n">Taux</th><th class="n">Ventes livrées</th><th class="n">Bénéfice</th></tr>
  ${act.slice().sort((a,b)=>b.ok-a.ok||b.benef-a.benef).map((r,i)=>`<tr><td>${i+1}. ${esc(r.v.nom)}</td><td class="n">${r.ok}</td><td class="n">${Math.round(r.ok/r.n*100)} %</td><td class="n">${F(r.ventes)}</td><td class="n"><b>${F(r.benef)}</b></td></tr>`).join('')}</table></div>
  <p class="mut">Bénéfice d'une livreuse = frais de livraison encaissés − essence ou électricité de ses courses − sa prime.</p></div>`:'<p class="mut">Aucune course terminée sur cette période.</p>'}
 <h2>Résultat du service livraison</h2>
 <div class="card tbl"><table>
  <tr><td>Frais de livraison encaissés${L.filter(l=>l.offert).length?` <span class="mut">(${L.filter(l=>l.offert).length} livraison(s) offerte(s))</span>`:''}</td><td class="n">${F(T('fr'))}</td></tr>
  <tr><td>Essence, électricité, indemnités (courses)</td><td class="n">− ${F(T('cout'))}</td></tr>
  <tr><td>Primes</td><td class="n">− ${F(T('prime'))}</td></tr>
  <tr><td>Réparations et entretien (vidange comprise)</td><td class="n">− ${F(repa)}</td></tr>
  ${vidPrev?`<tr><td style="color:var(--bad)">Vidange du mois pas encore faite (prévue)</td><td class="n">− ${F(vidPrev)}</td></tr>`:''}
  <tr><td>Épargne moto déposée</td><td class="n">− ${F(epar)}</td></tr>
  <tr><td>Salaires et rations des livreurs</td><td class="n">− ${F(st.coutLivreurs)}</td></tr>
  <tr><td><b>Résultat</b></td><td class="n"><b style="color:${net>=0?'var(--ok)':'var(--bad)'}">${F(net)}</b></td></tr></table>
  <p class="mut">Contrôle : pleins Cyrus payés ce mois ${F(essence)}. Ventes de chaussures livrées : ${F(T('ventes'))}.</p></div>
 <h2>Détail par livreur</h2>
 ${rows.map(r=>`<div class="card"><div class="liv"><b style="font-size:17px;color:var(--navy)">${esc(r.v.nom)}</b><span class="tag ${r.al?'bad':'ok'}">${r.al} alerte(s)</span></div>
  <div class="tbl"><table>
  <tr><td>Jours de livraison</td><td class="n">${r.j}</td></tr>
  <tr><td>Réussies / en partie / ratées</td><td class="n">${r.ok} / ${r.part} / ${r.ko}</td></tr>
  <tr><td>Moyenne par jour</td><td class="n">${r.j?(r.ok/r.j).toFixed(1):0} (quota ${st.quota})</td></tr>
  <tr><td>Km aller-retour</td><td class="n">${r.km.toFixed(1)} km</td></tr>
  <tr><td>Frais encaissés</td><td class="n">${F(r.fr)}</td></tr>
  <tr><td>Coût des courses</td><td class="n">− ${F(r.cout)}</td></tr>
  <tr><td>Bénéfice apporté</td><td class="n"><b>${F(r.benef)}</b></td></tr>
  <tr><td>Argent pas encore remis</td><td class="n" style="color:${r.du?'var(--bad)':'inherit'}">${F(r.du)}</td></tr>
  <tr><td><b>À payer en plus du salaire</b></td><td class="n"><b>${F(r.prime+r.indem)}</b> <span class="mut">(prime ${F(r.prime)}${r.indem?' + moto perso '+F(r.indem):''})</span></td></tr></table></div></div>`).join('')}
 ${Object.keys(raisons).length?`<h3>Raisons des « pas acheté »</h3><div class="card">${Object.entries(raisons).map(([k,v])=>`<div class="liv"><span>${esc(k)}</span><b>${v}</b></div>`).join('')}</div>`:''}
 ${pl.some(p=>p.alerte)?`<h3>Alertes essence</h3>${pl.filter(p=>p.alerte).map(p=>`<div class="note bad">${esc(p.alerte)}</div>`).join('')}`:''}
 ${gare.length?`<h3>Courses gare</h3><div class="card">${gare.map(g=>`<div class="liv"><span>${esc(g.cl)} · reçu ${esc(g.recu)}</span><b>${F(g.frais)} − ${F(g.ticket)} = ${F(g.frais-g.ticket)}</b></div>`).join('')}<p class="mut">Client ${F(st.gare.client)} − (gare + société). La part payée par la boutique apparaît en négatif, essence en plus.</p></div>`:''}`;
 $('#pv').onclick=()=>{perRef=P.deb-86400000;vBilan()};$('#nx').onclick=()=>{perRef=P.fin+86400000;vBilan()};}

 <div class="row"><div><label>Ensuite + (F)</label><input id="t_p" inputmode="numeric" value="${st.tarif.plus}"></div><div><label>par tranche de (km)</label><input id="t_k" inputmode="numeric" value="${st.tarif.pas}"></div></div>
 <div class="tbl" style="margin-top:8px"><table>${grille().map(([a,b])=>`<tr><td>${a}</td><td class="n">${F(b)}</td></tr>`).join('')}</table></div></div>
 <h2>Épargne moto</h2><div class="card"><div class="row"><div><label>Prix d'une moto neuve (F)</label><input id="m_p" inputmode="numeric" value="${st.motoPrix}"></div><div><label>En combien de mois</label><input id="m_m" inputmode="numeric" value="${st.motoMois}"></div></div>
 <h3>Envoi province</h3><div class="row"><div><label>Payé par le client</label><input id="g_c" inputmode="numeric" value="${st.gare.client}"></div><div><label>Ticket gare</label><input id="g_t" inputmode="numeric" value="${st.gare.ticket}"></div><div><label>Société</label><input id="g_s" inputmode="numeric" value="${st.gare.societe}"></div></div>
 <label>Vidange Cyrus chaque mois (F)</label><input id="s_vd" inputmode="numeric" value="${st.vidF}">
 <label>Prix du kWh (électricité, F)</label><input id="s_kw" inputmode="numeric" value="${st.kwhF}"></div>
 <h2>Primes et coûts</h2><div class="card">
 <div class="row"><div><label>Quota / jour</label><input id="s_q" inputmode="numeric" value="${st.quota}"></div><div><label>Prime au-delà (F)</label><input id="s_p" inputmode="numeric" value="${st.prime}"></div></div>
 <div class="row"><div><label>Coût au km moto perso (F)</label><input id="s_k" inputmode="numeric" value="${st.coutKm}"></div><div><label>Coût livreurs / mois (F)</label><input id="s_c" inputmode="numeric" value="${st.coutLivreurs}"></div></div>
 <div class="row"><div><label>Cyrus : plein complet (F)</label><input id="s_pf" inputmode="numeric" value="${st.pleinF}"></div><div><label>Prix du litre (F)</label><input id="s_pl" inputmode="numeric" value="${st.prixL}"></div><div><label>Conso. (L/100 km)</label><input id="s_cr" inputmode="decimal" value="${st.cyrRef}"></div></div>
 <label><input type="checkbox" id="s_cc" style="width:auto" ${st.codeClient?'checked':''}> Demander le code à 4 chiffres au client (contrôle renforcé)</label>
 <label>Appel de contrôle : 1 livraison sur</label><input id="s_ct" inputmode="numeric" value="${st.ctrl||5}">
 <label><input type="checkbox" id="s_m" style="width:auto" ${st.mesure?'checked':''}> Mois de mesure (pas de prime)</label></div>
 <h2>Motos électriques</h2><div class="card">
 ${st.batteries.map((b,i)=>`<h3>${esc(b.nom)}</h3><div class="row"><div><label>Ampère-heure</label><input data-bah="${i}" inputmode="decimal" value="${b.ah}"></div><div><label>Km à 42 km/h</label><input data-bkm="${i}" inputmode="numeric" value="${b.km42}"></div></div>`).join('')}
 <p class="mut">La 50 Ah est estimée à 133 km à 42 km/h par proportion avec la 30 Ah (80 km). Corrigez après les premiers vrais trajets.</p></div>
 <button class="btn gold" id="sv">Enregistrer les réglages</button>
 <h2>Sauvegarde</h2><div class="card"><p class="mut">Copiez ce texte et envoyez-le-vous sur WhatsApp. Pour restaurer, collez-le puis touchez « Restaurer ».</p>
 <textarea id="bk">${esc(JSON.stringify(S))}</textarea><button class="btn sm ghost" id="rs">Restaurer</button></div>`;
 $('#posLien').onclick=()=>{const p=parsePos($('#s_pos').value);if(!p){alert('Lien sans coordonnées.');return}st.shop=p;st.shopOk=true;save();vReg()};
 $('#resetShop').onclick=()=>{st.shopOk=false;save();alert('La caissière pourra réenregistrer la position dans « Nouveau bon ».');vReg()};
 $('#chRole').onclick=()=>{try{localStorage.removeItem('rcliv_role')}catch(e){}role=null;dir=false;render()};
 $('#addL').onclick=()=>{st.livreurs.push({id:uid(),nom:'Nouveau',tel:''});save();vReg()};
 $('#sv').onclick=()=>{st.waBoutique=telNorm($('#s_wa').value);st.waDir=telNorm($('#s_wd').value);st.baseUrl=$('#s_url').value.trim();
  document.querySelectorAll('[data-ln]').forEach(i=>st.livreurs[i.dataset.ln].nom=i.value.trim()||'Sans nom');
  document.querySelectorAll('[data-lt]').forEach(i=>st.livreurs[i.dataset.lt].tel=telNorm(i.value));
  st.livreurs=st.livreurs.filter(l=>l.nom!=='Sans nom');
  st.quota=+$('#s_q').value||6;st.prime=+$('#s_p').value||0;st.coutKm=+$('#s_k').value||20;st.coutLivreurs=+$('#s_c').value||0;st.mesure=$('#s_m').checked;st.codeClient=$('#s_cc').checked;st.ctrl=Math.max(2,+$('#s_ct').value||5);st.cyrRef=+String($('#s_cr').value).replace(',','.')||2.5;st.pleinF=+$('#s_pf').value||3000;st.tarif={base:+$('#t_b').value||1000,tol:+String($('#t_t').value).replace(',','.')||11,seuil:10,pas:+$('#t_k').value||5,plus:+$('#t_p').value||500};st.motoPrix=+$('#m_p').value||850000;st.motoMois=+$('#m_m').value||12;st.kwhF=+$('#s_kw').value||120;st.vidF=+$('#s_vd').value||3500;st.gare={client:+$('#g_c').value||1500,ticket:+$('#g_t').value||1000,societe:+$('#g_s').value||1000};if($('#s_pin').value.length>=4)st.pin=$('#s_pin').value;st.prixL=+$('#s_pl').value||850;
  document.querySelectorAll('[data-bah]').forEach(i=>st.batteries[i.dataset.bah].ah=+i.value||30);
  document.querySelectorAll('[data-bkm]').forEach(i=>st.batteries[i.dataset.bkm].km42=+i.value||80);
  st.batteries.forEach(b=>b.nom=`Moto électrique ${b.ah} Ah`);save();alert('Réglages enregistrés.');vReg()};
 $('#rs').onclick=()=>{try{const o=JSON.parse($('#bk').value);if(!o.settings)throw 0;if(confirm('Remplacer toutes les données de ce téléphone ?')){S=o;save();load();vReg()}}catch(e){alert('Texte de sauvegarde invalide.')}};
}

/* ===================== Démarrage (liens cliquables si hébergé) ===================== */
(function(){try{const hosted=/^https:$/.test(location.protocol)&&!/claude|anthropic/.test(location.hostname);
  if(hosted){if(!S.settings.baseUrl){S.settings.baseUrl=location.origin+location.pathname;save()}
   if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
   }}catch(e){}})();
(function(){const h=decodeURIComponent(location.hash||'');
 const b=h.match(/RCB:([A-Za-z0-9_-]+)/),r=h.match(/RCR:([A-Za-z0-9_-]+)/);
 if(b){try{bonRecu=dec(b[1]);tab='livreuse'}catch(e){}}
 else if(r){pasteMsg='RCR:'+r[1];tab='cours'}
 render()})();
</script>
</body>
</html>
